<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rdv · volume radiance (WebGPU)</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #16181d; color: #d6d9e0; font: 13px/1.4 system-ui, sans-serif;
         display: flex; gap: 16px; padding: 16px; box-sizing: border-box; height: 100vh; }
  #view { position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
          background: #0d0e11; border-radius: 6px; overflow: hidden; }
  canvas { width: min(100%, calc(100vh - 32px)); aspect-ratio: 1; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  #stats { position: absolute; top: 10px; left: 10px; padding: 8px 10px; border-radius: 4px;
           background: rgba(0, 0, 0, .6); font: 12px/1.5 ui-monospace, monospace; white-space: pre; pointer-events: none; }
  aside { width: 260px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  h1 { font-size: 15px; margin: 0; }
  h2 { font-size: 12px; margin: 6px 0 -4px; color: #8a909b; text-transform: uppercase; letter-spacing: .05em; }
  label { display: flex; flex-direction: column; gap: 4px; }
  label span { display: flex; justify-content: space-between; color: #9aa0ab; }
  input[type=range], select { width: 100%; }
  button { background: #2a2e37; color: inherit; border: 1px solid #3a3f4b; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  .help { color: #8a909b; font-size: 12px; }
  #error { color: #ff8a80; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="view">
  <canvas id="canvas" width="384" height="384"></canvas>
  <div id="stats">loading…</div>
</div>
<aside>
  <h1>Volume radiance</h1>
  <div class="help">Unbiased path tracing (delta tracking + next-event estimation) lit by a single directional
    light; refines progressively while nothing changes.<br>Left drag: orbit · Right / Shift drag: pan · Scroll: zoom</div>
  <label><span>Resolution</span>
    <select id="resolution"><option>128</option><option>256</option><option selected>384</option><option>512</option></select>
  </label>
  <label><span>Max samples / pixel <b id="maxSppOut"></b></span>
    <input id="maxSpp" type="range" min="16" max="2048" step="16" value="512">
  </label>
  <label><span>Exposure <b id="exposureOut"></b></span>
    <input id="exposure" type="range" min="-2" max="6" step="0.1" value="2">
  </label>
  <h2>Light</h2>
  <label><span>Azimuth <b id="azimuthOut"></b></span>
    <input id="azimuth" type="range" min="-180" max="180" step="1" value="46">
  </label>
  <label><span>Elevation <b id="elevationOut"></b></span>
    <input id="elevation" type="range" min="-89" max="89" step="1" value="52">
  </label>
  <h2>Medium</h2>
  <label><span>Density scale <b id="densityOut"></b></span>
    <input id="density" type="range" min="5" max="400" step="5" value="100">
  </label>
  <label><span>Anisotropy g <b id="gOut"></b></span>
    <input id="g" type="range" min="-0.9" max="0.9" step="0.05" value="0.4">
  </label>
  <label><span>Max bounces <b id="bouncesOut"></b></span>
    <input id="bounces" type="range" min="1" max="128" step="1" value="64">
  </label>
  <h2>Camera</h2>
  <label><span>Field of view <b id="fovOut"></b></span>
    <input id="fov" type="range" min="15" max="90" step="1" value="45">
  </label>
  <button id="reset">Reset camera</button>
  <div id="error"></div>
</aside>

<script type="module">
import { createDisplay } from '../common/display.js';
const $ = (id) => document.getElementById(id);
const stats = $('stats');
const canvas = $('canvas');
const num = (id) => Number($(id).value);

// ---------------------------------------------------------------- camera
// Orbit camera around `target`. rdv's own camera convention (see
// shaders/rendering/cameras.h, reproduced by RadianceView) maps screen right
// to cross(up, forward) and screen down to
// the camera's down axis (the image is presented with row 0 at the bottom), so mouse
// motion is converted through those same two axes.
const DEFAULT = { yaw: 0.6, pitch: 0.15, distance: 3.0, target: [0, 0, 0] };
const cam = structuredClone(DEFAULT);
const UP = [0, 1, 0];
const add = (a, b, s = 1) => a.map((x, i) => x + b[i] * s);
const sub = (a, b) => a.map((x, i) => x - b[i]);
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const normalize = (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); };

function origin() {
  const { yaw, pitch, distance, target } = cam;
  return add(target, [Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)], distance);
}
function screenAxes() {
  const forward = normalize(sub(cam.target, origin()));
  const right = normalize(cross(UP, forward));
  return { right, down: cross(right, forward) };
}
function lightDirection() {
  const az = num('azimuth') * Math.PI / 180, el = num('elevation') * Math.PI / 180;
  return [Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)];
}

// anything that changes the rendered estimate restarts accumulation
let restart = true;
let retonemap = false;
let drag = null;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, pan: e.button !== 0 || e.shiftKey };
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointerup', (e) => {
  drag = null;
  canvas.releasePointerCapture(e.pointerId);
  canvas.classList.remove('dragging');
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  const pixels = canvas.clientHeight;
  if (drag.pan) {
    // grab-style: the point under the cursor follows it
    const worldPerPixel = 2 * cam.distance * Math.tan(num('fov') * Math.PI / 360) / pixels;
    const { right, down } = screenAxes();
    cam.target = add(add(cam.target, right, -dx * worldPerPixel), down, -dy * worldPerPixel);
  } else {
    cam.yaw += dx / pixels * Math.PI;
    cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy / pixels * Math.PI));
  }
  restart = true;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.distance = Math.max(0.2, Math.min(20, cam.distance * Math.exp(e.deltaY * 0.001)));
  restart = true;
}, { passive: false });
$('reset').onclick = () => { Object.assign(cam, structuredClone(DEFAULT)); restart = true; };
for (const id of ['resolution', 'azimuth', 'elevation', 'density', 'g', 'bounces', 'fov']) $(id).oninput = () => { restart = true; };
$('exposure').oninput = () => { retonemap = true; };
$('maxSpp').oninput = () => { retonemap = true; };

function updateLabels() {
  $('maxSppOut').textContent = num('maxSpp');
  $('exposureOut').textContent = `${num('exposure') >= 0 ? '+' : ''}${num('exposure').toFixed(1)} EV`;
  $('azimuthOut').textContent = `${num('azimuth')}°`;
  $('elevationOut').textContent = `${num('elevation')}°`;
  $('densityOut').textContent = num('density');
  $('gOut').textContent = num('g').toFixed(2);
  $('bouncesOut').textContent = num('bounces');
  $('fovOut').textContent = `${num('fov')}°`;
}

// ---------------------------------------------------------------- case
const statsExtra = () => '';
const displayParams = () => ({ scale: Math.pow(2, num('exposure')) / Math.max(spp, 1), mode: 1, gamma: true });
const inputs = (w, h) => ({
  origin: origin(), target: cam.target, up: UP, fov: num('fov') * Math.PI / 180, width: w, height: h,
  'map.light_direction': lightDirection(),
  'map.density_scale': num('density'), 'map.g': num('g'), 'map.max_bounces': num('bounces'),
});

// ---------------------------------------------------------------- timings
const history = [];
const avg = (key) => history.reduce((s, h) => s + h[key], 0) / Math.max(history.length, 1);
let loadInfo = '';
function showStats(last) {
  if (last) {
    history.push(last);
    if (history.length > 30) history.shift();
  }
  const h = history.at(-1);
  if (!h) return;
  const span = (h.end - history[0].end) / 1000;
  const samples = history.slice(1).reduce((s, x) => s + x.k, 0);
  const rate = span > 0 ? samples / span : 0;
  const done = spp >= num('maxSpp') ? '  (done)' : '';
  stats.textContent =
    `${h.w}×${h.h} px   ${spp} spp${done}${statsExtra()}\n` +
    `evaluate (${String(h.k).padStart(2)} spp, GPU) ${h.evaluate.toFixed(2).padStart(7)} ms  ` +
    `= ${(h.evaluate / h.k).toFixed(2)} ms/sample\n` +
    `canvas draw            ${h.draw.toFixed(2).padStart(7)} ms  avg ${avg('draw').toFixed(2)}\n` +
    `frame total            ${h.total.toFixed(2).padStart(7)} ms  avg ${avg('total').toFixed(2)}\n` +
    `samples/s ${rate.toFixed(1)}   Mrays/s ${(rate * h.w * h.h / 1e6).toFixed(2)}\n` + loadInfo;
}

// ---------------------------------------------------------------- render
// Everything stays on the GPU: the kernel adds each sample into a resident
// heap region (accumulate = 1), several samples per frame in one submit
// (sized to ~FRAME_BUDGET_MS of GPU work), and the running sum is drawn
// straight onto the WebGPU canvas divided by spp - no readback.
const FRAME_BUDGET_MS = 14;
let evaluator, display, spp = 0, perFrame = 1;

const draw = () => {
  const w = num('resolution');
  display.draw(evaluator.region('image'), { width: w, height: w, channels: 3, ...displayParams() });
};

async function step() {
  const t0 = performance.now();
  const w = num('resolution'), h = w;
  const clear = restart;
  restart = false;
  if (clear) spp = 0;
  const k = Math.max(1, Math.min(perFrame, num('maxSpp') - spp));
  await evaluator.evaluate({ image: { bytes: w * h * 12, clear }, accumulate: 1, ...inputs(w, h) },
                           { threads: [w, h], repeat: k, readback: false });
  const t1 = performance.now();
  spp += k; // shown even if something changed meanwhile (the view follows a drag); the next step restarts
  draw();
  const t2 = performance.now();
  perFrame = Math.max(1, Math.min(64, Math.round(k * FRAME_BUDGET_MS / Math.max(t1 - t0, 0.5))));
  showStats({ w, h, k, evaluate: t1 - t0, draw: t2 - t1, total: t2 - t0, end: t2 });
}

let busy = false;
function tick() {
  updateLabels();
  if (!busy && (restart || spp < num('maxSpp'))) {
    busy = true;
    step().catch((e) => { $('error').textContent = String(e?.stack ?? e); })
          .finally(() => { busy = false; });
  } else if (retonemap && !busy && spp > 0) {
    draw();
    showStats();
  }
  retonemap = false;
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- startup
try {
  if (!navigator.gpu) throw new Error('This browser has no WebGPU (navigator.gpu is undefined).\n' +
                                      'Use a recent Chrome/Edge, or Firefox/Safari with WebGPU enabled.');
  const t0 = performance.now();
  const mod = await import('./radiance.js');
  const t1 = performance.now();
  evaluator = await mod.createEvaluator();
  display = createDisplay(evaluator.device, canvas);
  const t2 = performance.now();
  loadInfo = `\nmodule load   ${(t1 - t0).toFixed(0)} ms\npipeline+heap ${(t2 - t1).toFixed(0)} ms`;
  evaluator.device.lost.then((info) => { $('error').textContent = `GPU device lost: ${info.message}`; });
  requestAnimationFrame(tick);
} catch (e) {
  stats.textContent = 'failed';
  $('error').textContent = String(e?.stack ?? e);
}
</script>
</body>
</html>
